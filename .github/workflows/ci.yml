name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - name: lint
        run: ruff check .
      - name: english-only policy
        run: python tools/check_lang.py
      - name: dataset matches its generator
        run: |
          python tools/make_toy_dataset.py
          git diff --exit-code datasets/
      - name: tests
        run: pytest -q
      - name: regression gate on the toy dataset
        run: python -m evalkit.gate
